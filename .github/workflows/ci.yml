name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------- 1) Auto-fix formatting on main only --------------------
  fix-formatting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install ruff
      - run: ruff check . --fix
      - run: ruff format .

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(ci): auto-fix Ruff issues [skip ci]"

  # -------------------- 2) Tests + Coverage + Codecov --------------------
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # <-- Needed for OIDC (tokenless) upload
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # --- Caching step for uv ---
      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      # ---------------------------

      - name: Install dependencies
        run: |
          uv pip install --system \
            pytest pytest-asyncio pytest-cov \
            redis \
            -r requirements.txt

      - name: Run tests with coverage (XML)
        run: |
          uv run pytest -q --maxfail=1 --disable-warnings -s \
            --cov=agents --cov=core --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true # <-- Use tokenless authentication
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

  # -------------------- 3) CodeQL (REMOVED) --------------------
  # The CodeQL job has been moved to the separate file: codeql-analysis.yml
